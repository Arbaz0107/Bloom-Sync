name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm install

      - name: Prepare web bundle (www)
        run: |
          mkdir -p www
          cp index.html www/
          [ -f manifest.json ] && cp manifest.json www/ || true
          [ -d assets ] && cp -r assets www/assets || true

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Apply custom launcher icon
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          SRC=assets/icon.png
          if [ ! -f "$SRC" ]; then
            echo "::error::assets/icon.png is missing. Upload your logo to assets/icon.png (square PNG, 512x512 or 1024x1024)"
            exit 1
          fi
          RES=android/app/src/main/res
          # Remove adaptive-icon XML so Android uses our PNGs instead of the default icon
          rm -f $RES/mipmap-anydpi-v26/ic_launcher.xml $RES/mipmap-anydpi-v26/ic_launcher_round.xml
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            mkdir -p $RES/mipmap-$d
            convert "$SRC" -background none -resize ${s}x${s} -gravity center -extent ${s}x${s} $RES/mipmap-$d/ic_launcher.png
            cp $RES/mipmap-$d/ic_launcher.png $RES/mipmap-$d/ic_launcher_round.png
          done
          echo "Launcher icons generated:"
          ls -la $RES/mipmap-*/ic_launcher*.png

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BloomSync-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
