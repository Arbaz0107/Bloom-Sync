name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Prepare web bundle (www)
        run: |
          mkdir -p www
          cp index.html www/
          [ -f manifest.json ] && cp manifest.json www/ || true
          [ -d assets ] && cp -r assets www/assets || true

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Generate launcher icons
        run: |
          if [ -f assets/icon.png ]; then
            npm install --no-save @capacitor/assets
            npx capacitor-assets generate --android \
              --iconBackgroundColor '#ffffff' \
              --iconBackgroundColorDark '#ffffff'
          else
            echo "assets/icon.png not found, skipping icon generation"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BloomSync-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
